[package]
name = "lenso-postgres-kit"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Plugin-owned PostgreSQL schema lifecycle kit for Lenso applications"
repository = "https://github.com/LioRael/lenso-postgres-kit"
readme = "README.md"
keywords = ["lenso", "postgresql", "migration", "plugin"]
categories = ["database"]

[dependencies]
hex = "0.4"
sha2 = "0.11"
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json", "time"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json", "time"] }
thiserror = "2.0"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
